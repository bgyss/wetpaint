<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wetpaint</title>
<style>
  :root { --bg: #262626; --fg: #d8d8d8; --dim: #9a9a9a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #wetpaint { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 16px; text-align: center; color: var(--dim); pointer-events: none; }
</style>
</head>
<body>
<canvas id="wetpaint"></canvas>
<div id="status">Loading wetpaint…</div>
<script type="module">
  import init from "./wetpaint.js";
  const status = document.getElementById("status");
  init({ module_or_path: new URL("./wetpaint_bg.wasm", import.meta.url) })
    .then(() => { if (status.textContent.startsWith("Loading")) status.remove(); })
    .catch((e) => { status.textContent = "wetpaint could not start: " + e; });
</script>
</body>
</html>
