[package]
name = "wetpaint-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "wetpaint in the browser (WebGPU, with a WebGL fallback)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wetpaint = { path = "../app" }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.36.2"
egui-wgpu = { version = "0.36.2", default-features = false }
wgpu = { version = "30", features = ["webgpu", "webgl"] }
winit = { version = "0.30", default-features = false }
wet-fluid-gpu = { path = "../fluid-gpu" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement", "Element"] }
console_error_panic_hook = "0.1"
log = "0.4"
